      document.getElementById('salgsomk').value = s.salgsomk;
      document.getElementById('satsmode').value = s.satsmode || 'auto';
      document.getElementById('handelType').value = s.satsmode === 'ask' ? 'ask' : 'almindeligt';
      draftLots = (s.buys || []).map(b => ({ dato: b.dato || '', antal: b.antal ?? '', kurs: b.kurs ?? '', rate: String(b.rate ?? 1), mode: b.mode || 'kurs', totalDkk: b.totalDkk != null ? String(b.totalDkk) : '', komk: b.komk != null ? String(b.komk) : '0' }));
      if(draftLots.length === 0) draftLots = [{ dato: '', antal: '', kurs: '', rate: '1', mode: 'dkk', totalDkk: '', komk: '0' }];
      draftSalgMode = s.salgMode || 'kurs';
      draftSalgBelobDkk = s.salgBelobDkk != null ? String(s.salgBelobDkk) : '';
      draftSalgskurs = s.salgskurs != null ? String(s.salgskurs) : '';
      draftSalgRate = s.valuta === 'DKK' ? '' : (s.salgRate != null ? String(s.salgRate) : '');
      wireModalInputs();
      if(s.ticker) setTickerStatus(`Ticker: ${s.ticker}${s.navn ? ' · ' + s.navn : ''}`, 'ok');
      if(draftSalgMode === 'dkk'){
        document.getElementById('salgBelobDkk').value = s.salgBelobDkk || '';
      } else {
        document.getElementById('salgskurs').value = s.salgskurs;
        document.getElementById('salgRate').value = s.valuta === 'DKK' ? '' : s.salgRate;
      }
    } else {
      document.getElementById('ticker').value = '';
      document.getElementById('navn').value = '';
      draftLogoUrl = '';
      document.getElementById('type').value = 'Aktie';
      document.getElementById('maegler').value = brokerListe()[0] || NOT_SPECIFIED_BROKER;
      document.getElementById('aar').value = activeYear || new Date().getFullYear();
      document.getElementById('valuta').value = 'DKK';
      document.getElementById('salgDato').value = '';
      document.getElementById('antalSolgt').value = '';
      document.getElementById('salgsomk').value = '0';
      document.getElementById('satsmode').value = defaultSatsmode || 'auto';
      document.getElementById('handelType').value = defaultSatsmode === 'ask' ? 'ask' : 'almindeligt';
      draftLots = [{ dato: '', antal: '', kurs: '', rate: '1', mode: 'dkk', totalDkk: '', komk: '0' }];
      draftSalgMode = 'dkk';
      draftSalgBelobDkk = '';
      draftSalgskurs = '';
      draftSalgRate = '';
      wireModalInputs();
    }
    const modalOverlay = document.getElementById('modalOverlay');
    modalOverlay.classList.add('open');
    lockBackgroundScroll();
    wireFreeModalScroll(modalOverlay);
    updatePreview();
  }

  function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); unlockBackgroundScroll(); editingId = null; }

  function saveModal(){
    const draft = buildDraftSale();
    const { totalAntal } = computeGak(draft.buys, draft.valuta);
    const warnEl = document.getElementById('warnNote');

    if(!draft.navn && !draft.ticker){
      warnEl.textContent = 'Skriv mindst en tickerkode eller et navn på værdipapiret.';
      warnEl.style.display = 'block'; return;
    }
    if(draft.buys.length === 0 || draft.antalSolgt <= 0 || !salgBeloebUdfyldt(draft)){
      warnEl.textContent = 'Udfyld mindst ét køb (antal + beløb eller kurs) samt antal solgt og salgsbeløb/-kurs.';
      warnEl.style.display = 'block'; return;
    }
    if(draft.antalSolgt > totalAntal){
      warnEl.textContent = `Du har kun registreret køb af ${totalAntal} stk., men vil sælge ${draft.antalSolgt}. Tilføj flere køb, eller ret antal solgt.`;
      warnEl.style.display = 'block'; return;
    }
    warnEl.style.display = 'none';
    if(!draft.navn) draft.navn = draft.ticker;
    if(draft.ticker && !draft.logoUrl) draft.logoUrl = tickerLogoUrl(draft.ticker);

    if(editingId){
      const idx = state.sales.findIndex(s => s.id === editingId);
      if(idx !== -1) state.sales[idx] = Object.assign({ id: editingId }, draft);
    } else {
      draft.id = 'sale_' + Date.now() + '_' + Math.floor(Math.random()*1000);
      state.sales.push(draft);
    }
    save();
    if(activeYear && draft.aar !== activeYear) movedTradeNotice = `Handlen blev flyttet til ${draft.aar}, fordi salgsdatoen er valgt i ${draft.aar}.`;
    activeYear = draft.aar;
    editingId = null;
    unlockBackgroundScroll();
    render();
  }

  if('serviceWorker' in navigator){

  let overviewYear = new Date().getFullYear();
  let overviewChart = 'value';
  let overviewUnit = 'kr';
  // A monthly return requires adjacent valuations. Missing months are never
  // presented as zero return or silently bridged into a single month.
  function overviewRows(){
    const rows=computePortefoljeRows();
    rows.forEach((r,i)=>{
      const prev=rows[i-1];
      if(!prev || prev.vaerdi==null || (r.aar*12+r.maaned)-(prev.aar*12+prev.maaned)!==1){r.endringKr=null;r.endringPct=null;}
      if(prev && prev.vaerdi+(r.indskud||0)<=0)r.endringPct=null;
    });
    return rows;
  }
  function overviewMetrics(rows,year){
    const yearly=rows.filter(r=>r.aar===year), valued=yearly.filter(r=>r.vaerdi!=null);
    const last=valued.at(-1), measured=yearly.filter(r=>r.endringKr!=null);
    const expected=last?last.maaned:0;
    const complete=expected>0 && measured.length===expected;
    return {last,measured,complete,gain:measured.reduce((a,r)=>a+r.endringKr,0), pct:measured.every(r=>r.endringPct!=null)?measured.reduce((a,r)=>a*(1+r.endringPct/100),1)*100-100:null};
  }
  function renderOverviewChart(rows){
    const yearRows=rows.filter(r=>r.aar===overviewYear);
    const tabs=`<div class="ov-chart-head"><div><h2>Din udvikling</h2><p>Porteføljeværdi og afkast korrigeret for indskud og udtræk</p></div><div class="ov-switch" role="group" aria-label="Diagramtype"><button data-chart="value" aria-pressed="${overviewChart==='value'}">Porteføljeværdi</button><button data-chart="returns" aria-pressed="${overviewChart==='returns'}">Månedligt afkast</button></div></div>`;
    const unit=`<div class="ov-unit-slot"><div class="ov-unit ov-switch ${overviewChart==='value'?'ov-unit-placeholder':''}" ${overviewChart==='value'?'inert aria-hidden="true"':''} role="group" aria-label="Afkast enhed"><button data-unit="kr" aria-pressed="${overviewUnit==='kr'}">Kroner</button><button data-unit="pct" aria-pressed="${overviewUnit==='pct'}">Procent</button></div></div>`;
    let chart='';
    if(overviewChart==='value'){
      const baseline=rows.find(r=>r.aar===overviewYear-1&&r.maaned===12);
      chart=buildPortefoljeChartSvg(baseline?[baseline,...yearRows]:yearRows);
    }else{
      const values=yearRows.filter(r=>r.endringKr!=null);
      if(values.length){
        const get=r=>overviewUnit==='kr'?r.endringKr:r.endringPct;
        const limit=Math.max(1,...values.map(r=>Math.abs(get(r)||0)));
        chart=`<svg viewBox="0 0 720 270" role="img" aria-label="Månedligt afkast i ${overviewUnit==='kr'?'kroner':'procent'}" class="afk-chart-svg">${[-1,-0.5,0,0.5,1].map(f=>`<line x1="60" x2="705" y1="${130-f*90}" y2="${130-f*90}" stroke="var(--border)"/><text x="52" y="${134-f*90}" text-anchor="end" fill="var(--text-faint)" font-size="10">${overviewUnit==='kr'?fmtKrShort(f*limit):(f*limit).toFixed(1)+'%'}</text>`).join('')}${Array.from({length:12},(_,i)=>{
          const r=yearRows.find(r=>r.maaned===i+1),v=r&&r.endringKr!=null?get(r):null,x=72+i*53;
          return `${v==null?`<text x="${x+15}" y="135" text-anchor="middle" fill="var(--text-faint)" font-size="13">–</text>`:`<rect x="${x}" y="${v>=0?130-v/limit*90:130}" width="30" height="${Math.max(1,Math.abs(v)/limit*90)}" rx="3" fill="${v>=0?'var(--green)':'var(--red)'}"><title>${MAANEDSNAVNE[i]}: ${overviewUnit==='kr'?fmtKr(v):fmtPct(v)}</title></rect>`}<text x="${x+15}" y="251" text-anchor="middle" fill="var(--text-muted)" font-size="10">${MAANEDSNAVNE[i].slice(0,3)}</text>`;
        }).join('')}</svg>`;
      }
    }
    return `<section class="ak-panel ov-chart">${tabs}${unit}<div class="ov-chart-stage">${chart||'<div class="ak-empty-panel">Tilføj to sammenhængende måneders porteføljeværdi for at se udviklingen.</div>'}</div><div class="ov-caption">Værdikurven inkluderer indskud og udtræk; afkastet er korrigeret for dem. En streg betyder manglende afkastdata. Procenter er vejledende, da datoerne for pengebevægelser ikke indgår.</div></section>`;
  }
  function overviewToolbar(){
    const years=Array.from(new Set(state.portefolje.map(r=>r.aar).concat(state.sales.map(r=>r.aar),state.certificates.map(c=>certificateYearFor(c)),[new Date().getFullYear()]))).sort((a,b)=>b-a);
    return `<div class="ov-toolbar"><div class="ov-controls"><select id="ovYear" aria-label="Vælg år">${years.map(y=>`<option ${y===overviewYear?'selected':''}>${y}</option>`).join('')}</select></div></div>`;
  }
  function renderOverview(){
    const rows=overviewRows(), m=overviewMetrics(rows,overviewYear), last=m.last;
    const {perYear,askPerYear}=computeAll();
    const normal=perYear[overviewYear],ask=askPerYear[overviewYear];
    const certs=state.certificates.filter(c=>certificateYearFor(c)===overviewYear);
    const certTax=Math.max(0,certs.reduce((n,c)=>n+certificateResult(c),0))*state.certificateTaxRate/100;
    const hasTax=(normal?.sales.length||0)+(ask?.sales.length||0)+certs.length>0;
    const tax=Math.max(0,normal?.totalSkat||0)+Math.max(0,ask?.totalSkat||0)+certTax;
    const card=(label,value,sub,positive)=>`<div class="ak-card ov-card"><div class="ak-card-label">${label}</div><div class="ak-card-value ${positive===true?'pos':positive===false?'neg':''}">${value}</div><p>${sub}</p></div>`;
    const missing=rows.find(r=>r.aar===overviewYear&&r.vaerdi==null);
    return `<div class="ak-root">${overviewToolbar()}<div class="ov-welcome"><div><div class="ak-title">Dit overblik</div><div class="ak-subtitle">Følg din formue, dit afkast og årets registrerede handler.</div></div><button class="ak-add-btn" id="ovUpdate">Opdater portefølje →</button></div><div class="ak-summary ov-cards">${card('Porteføljeværdi',last?fmtKr(last.vaerdi):'—',last?'Senest opdateret · '+MAANEDSNAVNE[last.maaned-1]+' '+overviewYear:'Ingen værdi registreret')}${card('Seneste måneds afkast',last?.endringKr!=null?fmtKr(last.endringKr):'—',last?MAANEDSNAVNE[last.maaned-1]+(last.endringPct!=null?' · '+fmtPct(last.endringPct):' · mangler sammenligningsgrundlag'):'Afventer månedsopdatering',last?.endringKr!=null?last.endringKr>=0:undefined)}${card('Årets afkast',m.measured.length?fmtKr(m.gain):'—',m.complete?'Januar–'+MAANEDSNAVNE[last.maaned-1]+(m.pct!=null?' · '+fmtPct(m.pct)+' vejledende':' · procent kan ikke beregnes'):m.measured.length+' beregnelige måneder · ufuldstændigt år',m.measured.length?m.gain>=0:undefined)}${card('Skatteestimat · '+overviewYear,hasTax?fmtKr(tax):'—','Kun registrerede handler · se fordeling nedenfor')}</div>${missing?`<div class="ov-notice"><span>◷</span><div><strong>${MAANEDSNAVNE[missing.maaned-1]} mangler porteføljeværdi</strong><p>Nettoindskud på ${fmtKr(missing.indskud||0)} er gemt. Månedens afkast vises, når værdien er udfyldt.</p></div></div>`:''}${renderOverviewChart(rows)}<div class="ov-bottom"><section class="ak-panel"><div class="ov-section-head"><h2>Årets skatteestimat</h2><span>${overviewYear}</span></div><div class="ov-tax-row"><span>Almindeligt depot<small>Estimeret skat af registrerede salg</small></span><strong>${fmtKr(Math.max(0,normal?.totalSkat||0))}</strong></div><div class="ov-tax-row"><span>Aktiesparekonto<small>Salgsbaseret visning · usolgte aktiver mangler</small></span><strong>${fmtKr(Math.max(0,ask?.totalSkat||0))}</strong></div><div class="ov-tax-row"><span>Certifikater<small>Vejledende reserve · valgt sats ${state.certificateTaxRate}%</small></span><strong>${fmtKr(certTax)}</strong></div><p class="ov-caption">Beløbene er estimater fra appens eksisterende beregninger. De er ikke en samlet skatteregning. Fremførsel og modregning holdes inden for hver kategori.</p><button class="ak-editlink" id="ovTaxes">Se handler og skatteoverblik →</button></section><section class="ak-panel"><h2>Afkast, der er til at forstå</h2><p class="ov-explainer">Dit afkast er ændringen i porteføljens værdi, efter at indskud og udtræk er trukket ud af regnestykket.</p><div class="ov-formula">Slutværdi − startværdi<br>− indskud + udtræk</div><p class="ov-caption">Skatteestimatet trækkes ikke fra afkastet her. Medregn kontanter på depotet i din porteføljeværdi. Manglende måneder tæller ikke som nulafkast.</p></section></div></div>`;
  }
  function wireOverviewControls(){
    document.querySelectorAll('[data-chart]').forEach(b=>b.onclick=()=>{overviewChart=b.dataset.chart;render();});
    document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{overviewUnit=b.dataset.unit;render();});
    const year=document.getElementById('ovYear');if(year)year.onchange=()=>{overviewYear=Number(year.value);render();};
    const update=document.getElementById('ovUpdate');if(update)update.onclick=()=>{currentView='portefolje';render();openPfModal(null);};
    const taxes=document.getElementById('ovTaxes');if(taxes)taxes.onclick=()=>{currentView='aktiesalg';activeYear=overviewYear;render();};
  }

  onAuthStateChanged(auth, (user) => {
    if(demoMode) return;
    currentUser = user;
    if(user){ loginFejl = ''; loadData(); }
    else { render(); }
  });
</script>
</body>
</html>
