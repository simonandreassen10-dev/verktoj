    const threshold = thresholdInfo.amount;
    const yearData = perYear[activeYear] || { anden: 0, sales: [], totalGevinst: 0, totalSkat: 0, netto: 0, endCum: 0, carryOut: 0, carryIn: 0 };
    const askYearData = askPerYear[activeYear] || { sales: [], totalGevinst: 0, totalSkat: 0, netto: 0, endCum: 0, carryOut: 0, carryIn: 0 };
    const isGain = yearData.totalGevinst >= 0;
    const askIsGain = askYearData.totalGevinst >= 0;
    const andenVal = state.andenPerYear[activeYear] || 0;

    const skattepligtigt = Math.max(0, yearData.endCum);
    const scaleMax = Math.max(threshold * 1.6, skattepligtigt * 1.15, threshold + 1);
    const lowAmt = Math.min(skattepligtigt, threshold);
    const highAmt = Math.max(0, skattepligtigt - threshold);
    let lowFillPct = (lowAmt / scaleMax) * 100;
    let highFillPct = (highAmt / scaleMax) * 100;
    if(lowAmt > 0 && lowFillPct < 1.5) lowFillPct = 1.5;
    if(highAmt > 0 && highFillPct < 1.5) highFillPct = 1.5;
    const thresholdMarkPct = (threshold / scaleMax) * 100;
    const bracketStatus = skattepligtigt === 0
      ? 'Ingen skattepligtig aktieindkomst endnu.'
      : highAmt > 0
        ? `${fmtKrHel(highAmt)} af beløbet ligger over grænsen og beskattes med 42%.`
        : `Hele beløbet ligger under grænsen og beskattes med 27%.`;

    window.__akYears = years;
    window.__akActiveYear = activeYear;
    window.__akAndenVal = andenVal;

    const askCarryTax = askYearData.carryOut * 0.17;
    const askInline = `
      <div class="ak-tax-overview-head"><div><div class="ak-tax-overview-title">Skatteoverblik · aktiesparekonto</div><div class="ak-tax-overview-sub">ASK holdes adskilt fra dit almindelige depot og bruger en vejledende 17%-visning.</div></div><span class="ak-tax-overview-rate">ASK · 17%</span></div>
      <div class="ak-summary"><div class="ak-card"><div class="ak-card-label">Gevinst/tab i alt</div><div class="ak-card-value ${askIsGain ? 'pos' : 'neg'}">${fmtKr(askYearData.totalGevinst)}</div></div><div class="ak-card"><div class="ak-card-label">Beregnet skat på salg</div><div class="ak-card-value">${fmtKr(askYearData.totalSkat)}</div></div><div class="ak-card"><div class="ak-card-label">Efter skat</div><div class="ak-card-value ${askYearData.netto >= 0 ? 'pos' : 'neg'}">${fmtKr(askYearData.netto)}</div></div><div class="ak-card"><div class="ak-card-label">Tab til modregning</div><div class="ak-card-value ${askYearData.carryOut > 0 ? 'neg' : ''}">${fmtKr(askCarryTax)}</div></div></div>
      <div class="ak-carry-note">ASK-tallene holdes helt uden for 27/42%-beregningen og fremførte tab på dit almindelige depot. Bankens lageropgørelse er den endelige.${askYearData.carryOut > 0 ? ` Den viste negative ASK-skat på ${fmtKr(askCarryTax)} svarer vejledende til ${fmtKr(askYearData.carryOut)} i fremtidigt positivt ASK-afkast, før der igen beregnes ASK-skat.` : askYearData.carryIn > 0 ? ` Fremført negativ ASK-skat fra tidligere år er medregnet i årets vejledende skat.` : ''}</div>
      ${renderAskLedger(askYearData, activeYear)}`;

    const allSales = sorterDepotHandler(aktiesalgTab === 'ask' ? askYearData.sales : yearData.sales, false);
    const allSalesHtml = allSales.length === 0
      ? `<div class="ak-empty-panel">Ingen salg registreret for ${activeYear}.</div>`
      : allSales.map(s => saleEntryHtml(s, { showYear: false, mode: 'year', showSats: s.satsmode !== 'ask' })).join('');

    return `
      <div class="ak-root aktiesalg-scope-${aktiesalgTab}">
        <div class="ak-view-header">
          <div class="ak-title">Aktiesalg &amp; skat</div>
          <div class="ak-subtitle">${aktiesalgTab === 'ask' ? 'Se kun dine handler på aktiesparekontoen og deres separate skatteoverblik.' : 'Se kun handler på dit almindelige depot og det tilhørende skatteoverblik.'}</div>
        </div>

        ${renderAktiesalgTabs()}

        <div class="ak-panel ak-year-toolbar">
          <div class="ak-year-toolbar-copy">
            <div class="ak-year-toolbar-title">Vælg skatteår</div>
            <div class="ak-year-toolbar-sub">Viser alle salg samlet for året.</div>
          </div>
          <select class="ak-year-select" id="yearSelect" aria-label="Vælg skatteår"></select>
        </div>

        <div class="ak-panel ordinary-only" style="display:${aktiesalgTab === 'almindeligt' ? '' : 'none'};">
          <div class="ak-tax-overview-head">
            <div>
              <div class="ak-tax-overview-title">Skatteoverblik · almindeligt depot</div>
              <div class="ak-tax-overview-sub">Kun almindelige depotsalg og anden aktieindkomst indgår i 27/42%-beregningen.</div>
            </div>
            <span class="ak-tax-overview-rate">27% / 42%</span>
          </div>

          <div class="ak-summary">
            <div class="ak-card"><div class="ak-card-label">Gevinst/tab i alt</div><div class="ak-card-value ${isGain ? 'pos' : 'neg'}">${fmtKr(yearData.totalGevinst)}</div></div>
            <div class="ak-card"><div class="ak-card-label">Beregnet skat på salg</div><div class="ak-card-value">${fmtKr(yearData.totalSkat)}</div></div>
            <div class="ak-card"><div class="ak-card-label">Efter skat</div><div class="ak-card-value">${fmtKr(yearData.netto)}</div></div>
            <div class="ak-card"><div class="ak-card-label">Tab til modregning</div><div class="ak-card-value ${yearData.carryOut > 0 ? 'neg' : ''}">${fmtKr(yearData.carryOut)}</div></div>
          </div>

          ${yearData.carryOut > 0 ? `<div class="ak-carry-note"><strong>${fmtKr(yearData.carryOut)}</strong> står stadig til modregning. Du kan derfor realisere tilsvarende nettoaktiegevinster, før beregningen begynder at vise skat.</div>` : yearData.carryIn > 0 ? `<div class="ak-carry-note">Dit fremførte tab fra tidligere år er nu fuldt modregnet i ${activeYear}.</div>` : ''}

          ${renderLedger(yearData, activeYear, threshold)}

          <div class="ak-bracket-wrap">
            <div class="ak-bracket-label">Din skattepligtige aktieindkomst: ${fmtKrHel(skattepligtigt)}</div>
            <div class="ak-bracket-legend">
              <span><span class="afk-dot" style="background:var(--navy);"></span> 27% sats</span>
              <span><span class="afk-dot" style="background:var(--red);"></span> 42% sats</span>
            </div>
            <div class="ak-bracket-track">
              <div class="ak-bracket-fill"><div class="low" style="width:${lowFillPct}%"></div><div class="high" style="width:${highFillPct}%"></div></div>
              <div class="ak-bracket-threshold-mark" style="left:${thresholdMarkPct}%;"></div>
            </div>
            <div class="ak-bracket-scale">
              <span class="ak-bracket-scale-mark" style="left:${thresholdMarkPct}%;">${fmtKrHel(threshold)}<br><span class="ak-bracket-scale-sub">grænse for 27%/42%</span></span>
            </div>
            <div class="ak-bracket-note">${bracketStatus} Progressionsgrænse ${activeYear}: ${fmtKrHel(threshold)} (${state.gift ? 'gift og samlevende med ægtefælle' : 'enlig'}).${thresholdInfo.known ? '' : ` Foreløbig visning: grænsen for ${activeYear} er ikke indbygget endnu, så ${thresholdInfo.sourceYear}-grænsen bruges.`}</div>
          </div>

          <div class="ak-anden-row" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
            ${andenEditing ? `
              <span>Anden aktieindkomst i ${activeYear} (fx udbytter):</span>
              <input type="number" id="andenInput" class="ak-anden-input" value="${andenVal}" min="0" step="any" autofocus>
              <button class="ak-anden-save" id="andenSaveBtn">Gem</button>
            ` : `
              <span>Anden aktieindkomst i ${activeYear} (fx udbytter): <strong>${fmtKr(andenVal)}</strong></span>
              <button class="ak-editlink" id="andenEditBtn">Rediger</button>
            `}
          </div>
        </div>

        <div class="ak-panel ask-only" style="display:${aktiesalgTab === 'ask' ? '' : 'none'};">${askInline}</div>

        <div class="ak-panel">
          <div class="ak-list-header">
            <div>
              <div class="ak-list-title">${aktiesalgTab === 'ask' ? 'ASK-salg' : 'Salg · almindeligt depot'} · ${activeYear}</div>
              <div style="font-size:11px;color:var(--text-faint);margin-top:2px;">${aktiesalgTab === 'ask' ? 'Kun handler på aktiesparekontoen vises her.' : 'Kun handler på dit almindelige aktiedepot vises her.'}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;"><select id="depotSortSelect" aria-label="Sortér handler" style="width:auto;"><option value="nyeste" ${depotSort === 'nyeste' ? 'selected' : ''}>Nyeste</option><option value="aeldste" ${depotSort === 'aeldste' ? 'selected' : ''}>Ældste</option><option value="resultat" ${depotSort === 'resultat' ? 'selected' : ''}>Størst afkast (kr.)</option><option value="procent" ${depotSort === 'procent' ? 'selected' : ''}>Størst afkast (%)</option></select><button class="ak-add-btn" id="openAddBtn">+ Tilføj salg</button></div>
          </div>
          <div class="ak-entry-list" id="salesList">${allSalesHtml}</div>
        </div>

        <div class="ak-footnote">${movedTradeNotice ? escapeHtml(movedTradeNotice) + ' ' : ''}Se skattesatser og regler under ⚙️ Indstillinger → Om skattesatserne</div>
      </div>
    `;
  }

  function wireAktiesalgView(){
    if(aktiesalgTab === 'certifikater'){ wireCertifikaterView(); return; }
    const years = window.__akYears, activeYearLocal = window.__akActiveYear, andenVal = window.__akAndenVal;
    const yearSelect = document.getElementById('yearSelect');
    yearSelect.innerHTML = years.map(y => `<option value="${y}" ${y === activeYearLocal ? 'selected' : ''}>${y}</option>`).join('');
    yearSelect.addEventListener('change', () => { renderBloedt(() => { activeYear = parseInt(yearSelect.value); movedTradeNotice = ''; render(); }); });
    document.querySelectorAll('[data-sales-tab]').forEach(btn => btn.addEventListener('click', () => { aktiesalgTab = btn.dataset.salesTab; renderBloedt(); }));
    document.getElementById('depotSortSelect').addEventListener('change', e => { depotSort = e.target.value; renderBloedt(); });

    if(aktiesalgTab === 'almindeligt' && andenEditing){
      const input = document.getElementById('andenInput');
      input.focus();
      input.select();
      const commit = () => {
        state.andenPerYear[activeYearLocal] = parseFloat(input.value.replace(',','.')) || 0;
        andenEditing = false;
        save(); renderBloedt();
      };
      document.getElementById('andenSaveBtn').addEventListener('click', commit);
      input.addEventListener('keydown', (e) => { if(e.key === 'Enter') commit(); if(e.key === 'Escape'){ andenEditing = false; renderBloedt(); } });
    } else if(aktiesalgTab === 'almindeligt') {
      document.getElementById('andenEditBtn').addEventListener('click', () => { andenEditing = true; renderBloedt(); });
    }
    if(aktiesalgTab === 'almindeligt') document.getElementById('ledgerToggleBtn').addEventListener('click', () => { ledgerOpen = !ledgerOpen; renderBloedt(); });
    if(aktiesalgTab === 'ask') document.getElementById('askLedgerToggleBtn').addEventListener('click', () => { askLedgerOpen = !askLedgerOpen; renderBloedt(); });

    document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openModal(btn.dataset.edit); }));
    document.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); deleteSale(btn.dataset.del); }));
    wireSaleCards(document.getElementById('salesList'));
    document.getElementById('openAddBtn').addEventListener('click', () => openModal(null, aktiesalgTab === 'ask' ? 'ask' : 'auto'));
  }

  // ============ CERTIFIKATER VIEW ============
  // Certifikater er ikke en del af aktiesalgs- eller ASK-beregningen. Mange typer
  // beskattes anderledes (ofte som finansielle kontrakter), derfor er tallet her en
  // brugerstyret reserve og aldrig en erstatning for årsopgørelsen.
  function certificateResult(c){
    return (parseFloat(c.endValue) || 0) - (parseFloat(c.startValue) || 0) - (parseFloat(c.costs) || 0);
  }
  function certificateYearFor(c){ return parseInt(String(c.date || '').slice(0,4), 10) || new Date().getFullYear(); }

  function certifikatEntryHtml(c){
    const result = certificateResult(c);
    const pct = (parseFloat(c.startValue) || 0) > 0 ? (result / (parseFloat(c.startValue) || 1)) * 100 : 0;
    const rate = Math.max(0, Math.min(100, Number(state.certificateTaxRate) || 0));
    const tax = Math.max(0, result) * rate / 100;
    const afterTax = result - tax;
    const model = { navn: c.name || 'Unavngivet certifikat', ticker: '', logoUrl: '', maegler: 'Certifikat', valuta: 'DKK' };
    return `<div class="ak-entry cert-entry ${result >= 0 ? 'gain' : 'loss'}" data-cert-details="${escapeHtml(c.id)}" tabindex="0" role="button" aria-label="Vis detaljer om ${escapeHtml(c.name || 'certifikatet')}">
      <div class="ak-entry-row-top">${saleIdentityHtml(model, result >= 0, false).replace('<span class="ak-broker-badge">Certifikat</span>', '<span class="ak-ask-badge">CERTIFIKAT</span>')}
        <div class="ak-entry-top-right"><span class="ak-entry-pct ${result >= 0 ? 'pos' : 'neg'}">${fmtPct(pct)}</span><button class="ak-edit-btn" data-cert-edit="${escapeHtml(c.id)}" data-tip="Rediger" aria-label="Rediger certifikat">${iconEdit()}</button><button class="ak-del-btn" data-cert-delete="${escapeHtml(c.id)}" data-tip="Slet" aria-label="Slet certifikat">${iconTrash()}</button><span class="ak-entry-chevron" aria-hidden="true">›</span></div>
      </div>
      <div class="ak-entry-row-bottom"><span class="ak-entry-meta">${escapeHtml(c.kind || 'Certifikat')} · ${formatDatoDa(c.date)} · Start ${fmtKr(parseFloat(c.startValue)||0)} · Slut ${fmtKr(parseFloat(c.endValue)||0)}</span><span class="ak-fin-chips"><span class="ak-fin-chip"><span class="lbl">Resultat</span><span class="val ${result >= 0 ? 'pos' : 'neg'}">${fmtKr(result)}</span></span><span class="ak-fin-chip"><span class="lbl">Skat</span><span class="val">${fmtKr(tax)}</span></span><span class="ak-fin-chip"><span class="lbl">Efter skat</span><span class="val ${afterTax >= 0 ? 'pos' : 'neg'}">${fmtKr(afterTax)}</span></span></span></div>
    </div>`;
  }

  function renderCertifikatDetailsContent(c){
    const result = certificateResult(c);
    const start = parseFloat(c.startValue) || 0;
    const end = parseFloat(c.endValue) || 0;
    const costs = parseFloat(c.costs) || 0;
    const pct = start > 0 ? (result / start) * 100 : 0;
    const tax = Math.max(0, result) * (Math.max(0, Math.min(100, Number(state.certificateTaxRate) || 0)) / 100);
    const afterTax = result - tax;
    const gain = result >= 0;
    return `<div class="ak-modal-header"><div class="ak-modal-title" id="saleDetailsTitle">Overblik over certifikatet</div><button class="ak-modal-close" id="saleDetailsClose" aria-label="Luk">×</button></div>
      <div class="ak-sale-details-body"><div class="ak-details-hero">${saleIdentityHtml({navn:c.name || 'Unavngivet certifikat', maegler:'Certifikat', valuta:'DKK'}, gain, false).replace('<span class="ak-broker-badge">Certifikat</span>', '<span class="ak-ask-badge">CERTIFIKAT</span>')}<div class="ak-details-return"><div class="ak-details-return-value ${gain ? 'pos' : 'neg'}">${fmtPct(pct)}</div><div class="ak-details-return-label">Udvikling</div></div></div>
      <div class="ak-details-story"><span aria-hidden="true">◈</span><span>Certifikatet har et resultat på <strong>${fmtKr(Math.abs(result))}</strong> svarende til <strong>${fmtPct(pct)}</strong>. Efter vejledende skat er resultatet <strong>${fmtKr(afterTax)}</strong>.</span></div>
      <div class="ak-details-trade-grid"><section class="ak-details-trade-card purchase"><div class="ak-details-trade-head"><div class="ak-details-trade-title"><span class="ak-details-trade-icon">S</span>Start</div><span class="ak-details-trade-date">${formatDatoDa(c.date)}</span></div><div class="ak-details-trade-primary"><div class="ak-details-trade-primary-label">Startværdi / kostpris</div><div class="ak-details-trade-primary-value">${fmtKr(start)}</div></div></section><section class="ak-details-trade-card sale"><div class="ak-details-trade-head"><div class="ak-details-trade-title"><span class="ak-details-trade-icon">U</span>Slut</div><span class="ak-details-trade-date">${formatDatoDa(c.date)}</span></div><div class="ak-details-trade-primary"><div class="ak-details-trade-primary-label">Slutværdi / udbetaling</div><div class="ak-details-trade-primary-value">${fmtKr(end)}</div></div></section></div>
      <div class="ak-details-summary"><div class="ak-details-stat"><div class="ak-details-stat-label">Handelsomkostninger</div><div class="ak-details-stat-value">${fmtKr(costs)}</div></div><div class="ak-details-stat"><div class="ak-details-stat-label">Resultat</div><div class="ak-details-stat-value ${gain ? 'pos' : 'neg'}">${fmtKr(result)}</div></div><div class="ak-details-stat"><div class="ak-details-stat-label">Vejledende skat</div><div class="ak-details-stat-value">${fmtKr(tax)}</div></div><div class="ak-details-stat"><div class="ak-details-stat-label">Efter skat</div><div class="ak-details-stat-value ${afterTax >= 0 ? 'pos' : 'neg'}">${fmtKr(afterTax)}</div></div></div>
      <div class="ak-details-groups"><section class="ak-details-group"><div class="ak-details-group-title">Registrering</div><div class="ak-details-info-row"><span class="ak-details-info-label">Type</span><span class="ak-details-info-value">${escapeHtml(c.kind || 'Certifikat')}</span></div><div class="ak-details-info-row"><span class="ak-details-info-label">Skatteår</span><span class="ak-details-info-value">${certificateYearFor(c)}</span></div>${c.note ? `<div class="ak-details-info-row"><span class="ak-details-info-label">Note</span><span class="ak-details-info-value">${escapeHtml(c.note)}</span></div>` : ''}</section></div></div>
      <div class="ak-sale-details-footer"><button class="ak-cancel-btn" id="saleDetailsCloseFooter">Luk</button><button class="ak-submit-btn" id="certDetailsEdit" style="flex:0 0 auto;">Rediger certifikat</button></div>`;
  }

  function openCertifikatDetails(id){
    const cert = (state.certificates || []).find(c => c.id === id);
    const overlay = document.getElementById('saleDetailsOverlay');
    const content = document.getElementById('saleDetailsContent');
    if(!cert || !overlay || !content) return;
    certificateDetailsId = id;
    content.innerHTML = renderCertifikatDetailsContent(cert);
    overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false'); lockBackgroundScroll(); wireBackdropClose(overlay, closeSaleDetails);
    document.getElementById('saleDetailsClose').addEventListener('click', closeSaleDetails);
    document.getElementById('saleDetailsCloseFooter').addEventListener('click', closeSaleDetails);
    document.getElementById('certDetailsEdit').addEventListener('click', () => { overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); openCertifikatModal(id); });
  }

  function wireCertifikatCards(root){
    if(!root) return;
    root.querySelectorAll('[data-cert-details]').forEach(card => {
      const open = e => { if(e.target.closest('button')) return; openCertifikatDetails(card.dataset.certDetails); };
      card.addEventListener('click', open);
      card.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')){ e.preventDefault(); openCertifikatDetails(card.dataset.certDetails); } });
    });
  }

  function renderCertifikatModal(){
    return `<div class="ak-modal-overlay" id="certModalOverlay" aria-hidden="true"><div class="ak-modal"><div class="ak-modal-header"><div class="ak-modal-title" id="certModalTitle">Tilføj certifikat</div><button class="ak-modal-close" id="certModalClose" aria-label="Luk">×</button></div><form id="certModalForm"><div class="ak-modal-body"><div class="ak-modal-form"><div class="ak-field-row"><div class="ak-field"><label for="certName">Navn / produkt</label><input id="certName" required placeholder="fx Bull/Bear-certifikat"></div><div class="ak-field"><label for="certKind">Type</label><input id="certKind" value="Certifikat" placeholder="fx open-end certifikat"></div></div><div class="ak-field-row"><div class="ak-field"><label for="certDate">Dato for opgørelse/salg</label><input id="certDate" type="date"></div><div class="ak-field"><label for="certCosts">Handelsomkostninger (DKK)</label><input id="certCosts" type="text" inputmode="decimal" value="0" placeholder="fx 30 + 20"><div class="ak-fx-hint" id="certCostsHint"></div></div></div><div class="ak-field-row"><div class="ak-field"><label for="certStart">Startværdi / kostpris (DKK)</label><input id="certStart" type="number" min="0" step="any" required></div><div class="ak-field"><label for="certEnd">Slutværdi / udbetaling (DKK)</label><input id="certEnd" type="number" min="0" step="any" required></div></div><div class="ak-field"><label for="certNote">Note (valgfri)</label><input id="certNote" placeholder="fx ISIN eller skattebemærkning"></div><div class="cert-disclaimer">Du kan skrive fx 30 + 20 i omkostninger. Summen fratrækkes resultatet før den vejledende skat beregnes.</div></div></div><div class="ak-modal-footer"><div class="ak-form-actions"><button type="button" class="ak-cancel-btn" id="certModalCancel">Annuller</button><button class="ak-submit-btn" id="certModalSave">Gem certifikat</button></div></div></form></div></div>`;
  }

  function openCertifikatModal(id){
    certificateEditingId = id || 'new';
    const cert = id ? state.certificates.find(c => c.id === id) : null;
    document.getElementById('certModalTitle').textContent = cert ? 'Rediger certifikat' : 'Tilføj certifikat';
    document.getElementById('certModalSave').textContent = cert ? 'Gem ændringer' : 'Tilføj certifikat';
    document.getElementById('certName').value = cert?.name || '';
    document.getElementById('certKind').value = cert?.kind || 'Certifikat';
    document.getElementById('certDate').value = cert?.date || `${certificateYear || new Date().getFullYear()}-01-01`;
    document.getElementById('certStart').value = cert?.startValue ?? '';
    document.getElementById('certEnd').value = cert?.endValue ?? '';
    document.getElementById('certCosts').value = cert?.costs ?? '0';
    document.getElementById('certNote').value = cert?.note || '';
    const overlay = document.getElementById('certModalOverlay'); overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false'); lockBackgroundScroll(); document.getElementById('certName').focus();
  }

  function closeCertifikatModal(){ const overlay = document.getElementById('certModalOverlay'); overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); certificateEditingId = null; unlockBackgroundScroll(); }

  function wireCertifikatModal(){
    const form = document.getElementById('certModalForm');
    const costsInput = document.getElementById('certCosts');
    const updateCostsHint = () => { const sum = beregnUdtryk(costsInput.value); document.getElementById('certCostsHint').textContent = sum != null && /[+-]/.test(costsInput.value.trim().slice(1)) ? `= ${fmtKr(sum)}` : ''; };
    costsInput.addEventListener('input', updateCostsHint);
    updateCostsHint();

  // ============ AFKASTBEREGNER VIEW ============
  const AFKAST_DEFAULTS = { start: '10000', maanedligt: '2000', pct: '7', aar: '20' };
  let afkastSaveTimer = null;

  function afkastDefaults(){
    return Object.assign({}, AFKAST_DEFAULTS, state.afkast || {});
  }

  function computeAfkast(start, maanedligt, pct, aar){
    const safeStart = Math.max(0, Number.isFinite(start) ? start : 0);
    const safeMaanedligt = Math.max(0, Number.isFinite(maanedligt) ? maanedligt : 0);
    const safeAar = Math.min(100, Math.max(1, Number.isFinite(aar) ? aar : 1));
    const months = Math.max(1, Math.round(safeAar * 12));
    const monthlyRate = Math.pow(1 + pct / 100, 1/12) - 1;
    let value = safeStart, contributed = safeStart;
    const points = [{ year: 0, value, contributed }];
    for(let m = 1; m <= months; m++){
      // Det månedlige indskud lægges til ved månedens slutning.
      value = value * (1 + monthlyRate) + safeMaanedligt;
      contributed += safeMaanedligt;
      if(m % 12 === 0 || m === months){
        points.push({ year: m / 12, value, contributed });
      }
    }
    return { points, finalValue: value, totalContributed: contributed, totalGain: value - contributed, years: months / 12 };
  }

  function buildAfkastChartSvg(points, isGain){
    const W = 640, H = 260, padL = 54, padR = 14, padT = 14, padB = 28;
    // Medtag både formue og indskud i skalaen. Ellers kan indskudslinjen blive klippet
    // ved et lavt eller negativt forventet afkast.
    const maxVal = Math.max(...points.flatMap(p => [p.value, p.contributed]), 1);
    const maxYear = points[points.length - 1].year || 1;
    const x = (year) => padL + (year / maxYear) * (W - padL - padR);
    const y = (val) => padT + (1 - Math.max(0, val) / maxVal) * (H - padT - padB);
    const resultColor = isGain ? 'var(--green)' : 'var(--red)';

    const valuePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(p.year).toFixed(1)} ${y(p.value).toFixed(1)}`).join(' ');
    const contribPath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(p.year).toFixed(1)} ${y(p.contributed).toFixed(1)}`).join(' ');
    const areaPath = valuePath + ` L ${x(points[points.length-1].year).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;

    const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
      const val = maxVal * f;
      const yy = y(val).toFixed(1);
      return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1" />
              <text x="${padL - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle" font-size="10" font-family="Inconsolata, monospace" fill="var(--text-faint)">${fmtKrShort(val)}</text>`;
    }).join('');

    const labelStep = Math.max(1, Math.ceil(points.length / 6));
    const xLabels = points.filter((p, i) => i === 0 || i === points.length - 1 || i % labelStep === 0)
      .map(p => `<text x="${x(p.year).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" font-family="Inconsolata, monospace" fill="var(--text-faint)">År ${Number.isInteger(p.year) ? p.year : p.year.toLocaleString('da-DK', { maximumFractionDigits: 1 })}</text>`).join('');

    return `
      <svg viewBox="0 0 ${W} ${H}" class="afk-chart-svg" role="img" aria-label="Udvikling i samlet formue og indskudt beløb">
        <defs>
          <linearGradient id="afkFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${resultColor}" stop-opacity="0.24" />
            <stop offset="100%" stop-color="${resultColor}" stop-opacity="0.02" />
          </linearGradient>
        </defs>
        ${gridLines}
        <path d="${areaPath}" fill="url(#afkFill)" stroke="none" />
        <path d="${contribPath}" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4 4" />
        <path d="${valuePath}" fill="none" stroke="${resultColor}" stroke-width="2.5" />
        ${xLabels}
      </svg>
    `;
  }

  function fmtKrShort(n){
    if(n >= 1000000) return (n/1000000).toLocaleString('da-DK', {maximumFractionDigits:1}) + ' mio.';
    if(n >= 1000) return Math.round(n/1000) + 't.';
    return Math.round(n).toString();
  }

  function renderAfkastContent(){

  function renderAfkastResult(){
    const panel = document.getElementById('afkResultPanel');
    if(!panel) return;
    const startInput = document.getElementById('afkStart').value.trim();
    const maanedligtInput = document.getElementById('afkMaanedligt').value.trim();

    const aarInput = document.getElementById('afkAar').value.trim();
    if(!startInput && !maanedligtInput && !pctInput && !aarInput){
      panel.innerHTML = `<div class="ak-empty-panel">Udfyld felterne ovenfor for at se beregningen.</div>`;

    }
    const start = parseFloat(startInput);
    const maanedligt = parseFloat(maanedligtInput);
    const pct = parseFloat(pctInput);
    const aar = parseFloat(aarInput);

    if(Number.isFinite(pct) && pct <= -100){
      panel.innerHTML = `<div class="afk-error"><strong>Afkastet skal være højere end −100%.</strong><br>Et afkast på −100% eller lavere kan ikke omregnes til en månedlig renters-rente-sats.</div>`;
      return;
    }
    if(Number.isFinite(aar) && aar > 100){
      panel.innerHTML = `<div class="afk-error"><strong>Vælg højst 100 år.</strong><br>Det holder beregningen og diagrammet læsbart.</div>`;
      return;
    }

    const safeStart = Number.isFinite(start) ? Math.max(0, start) : 0;
    const safeMaanedligt = Number.isFinite(maanedligt) ? Math.max(0, maanedligt) : 0;
    const safePct = Number.isFinite(pct) ? pct : 0;
    const safeAar = Number.isFinite(aar) ? Math.max(1, aar) : 1;
    const { points, finalValue, totalContributed, totalGain, years } = computeAfkast(safeStart, safeMaanedligt, safePct, safeAar);
    if(!Number.isFinite(finalValue) || !Number.isFinite(totalGain)){
      panel.innerHTML = `<div class="afk-error"><strong>Tallene giver et for stort resultat.</strong><br>Prøv et lavere forventet afkast eller en kortere periode.</div>`;
      return;
    }
    const isGain = totalGain >= 0;
    const gainClass = isGain ? 'pos' : 'neg';
    const afkastAndel = finalValue > 0 ? (totalGain / finalValue) * 100 : 0;
    const insight = isGain
      ? `Afkastet udgør ${Math.max(0, afkastAndel).toLocaleString('da-DK', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}% af slutbeløbet.`
      : `Det forventede negative afkast reducerer værdien med ${fmtKrHel(Math.abs(totalGain))}.`;

    panel.innerHTML = `
      <div class="afk-summary">
        <div class="ak-card"><div class="ak-card-label">Slutbeløb efter ${years.toLocaleString('da-DK', { maximumFractionDigits: 1 })} år</div><div class="ak-card-value ${gainClass}">${fmtKrHel(finalValue)}</div></div>
        <div class="ak-card"><div class="ak-card-label">Samlet indskudt</div><div class="ak-card-value">${fmtKrHel(totalContributed)}</div></div>
        <div class="ak-card"><div class="ak-card-label">Samlet afkast</div><div class="ak-card-value ${gainClass}">${fmtKrHel(totalGain)}</div></div>
      </div>
      <div class="ak-carry-note"><strong>${insight}</strong> Månedlige indskud regnes ved månedens slutning.</div>
      <div class="afk-chart-legend">
        <span><span class="afk-dot" style="background:${isGain ? 'var(--green)' : 'var(--red)'};"></span> Samlet formue</span>
        <span><span class="afk-dot dashed"></span> Indskudt i alt</span>
      </div>
      ${buildAfkastChartSvg(points, isGain)}
    `;
  }

  // ============ PORTEFØLJE VIEW ============
  const MAANEDSNAVNE = ['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'];
  let pendingPfDelete = null;
  let pendingPfDeleteTimer = null;
  let pfEditingKey = null;
  let pfStatsOpen = true;

  function computePortefoljeRows(){
    const log = Array.isArray(state.portefolje) ? state.portefolje : [];
    const rows = log.slice().sort((a, b) => a.aar - b.aar || a.maaned - b.maaned).map(e => ({
      aar: e.aar, maaned: e.maaned,
      vaerdi: Number.isFinite(e.vaerdi) ? e.vaerdi : null,
      indskud: Number.isFinite(e.indskud) ? e.indskud : null,
      note: e.note || null
    }));
    let prevVaerdi = null;
    rows.forEach(r => {
      if(r.vaerdi != null){
        if(prevVaerdi != null){
          const indskud = r.indskud || 0;
          const endringKr = r.vaerdi - prevVaerdi - indskud;
          const basis = prevVaerdi + indskud;
          r.endringKr = endringKr;
          r.endringPct = basis !== 0 ? (endringKr / basis) * 100 : null;
        } else {
          r.endringKr = null; r.endringPct = null;
        }
        prevVaerdi = r.vaerdi;
      } else {
        r.endringKr = null; r.endringPct = null;
      }
    });
    return rows;
  }

  function computePortefoljeStats(rows){
    const filled = rows.filter(r => r.endringKr != null);
    const perYear = {};
    filled.forEach(r => {
      if(!perYear[r.aar]) perYear[r.aar] = { sumKr: 0, faktor: 1, count: 0 };
      perYear[r.aar].sumKr += r.endringKr;
      perYear[r.aar].faktor *= (1 + (r.endringPct || 0) / 100);
      perYear[r.aar].count++;
    });
    const aarListe = Object.keys(perYear).map(Number).sort((a, b) => a - b).map(aar => ({
      aar, sumKr: perYear[aar].sumKr, pct: (perYear[aar].faktor - 1) * 100
    }));
    const avgKr = filled.length ? filled.reduce((s, r) => s + r.endringKr, 0) / filled.length : 0;
    const avgPct = filled.length ? filled.reduce((s, r) => s + (r.endringPct || 0), 0) / filled.length : 0;
    const bedste = filled.length ? filled.reduce((a, b) => b.endringKr > a.endringKr ? b : a) : null;
    const vaerste = filled.length ? filled.reduce((a, b) => b.endringKr < a.endringKr ? b : a) : null;

    const medVaerdi = rows.filter(r => r.vaerdi != null);
    const medIndskud = rows.filter(r => r.indskud != null);
    const antalMaaneder = rows.length;
    const gnsIndskud = medIndskud.length ? medIndskud.reduce((s, r) => s + r.indskud, 0) / medIndskud.length : 0;
    const maxVaerdi = medVaerdi.length ? Math.max(...medVaerdi.map(r => r.vaerdi)) : 0;
    const groenneMdr = filled.filter(r => r.endringKr >= 0).length;
    const roedeMdr = filled.filter(r => r.endringKr < 0).length;
    const totalIndskud = medIndskud.reduce((s, r) => s + r.indskud, 0);
    const totalAfkast = filled.reduce((s, r) => s + r.endringKr, 0);
    const totalVaekst = medVaerdi.length > 1 ? medVaerdi[medVaerdi.length - 1].vaerdi - medVaerdi[0].vaerdi : 0;

    return {
      aarListe, avgKr, avgPct, bedste, vaerste, harData: filled.length > 0,
      antalMaaneder, gnsIndskud, maxVaerdi, groenneMdr, roedeMdr, totalIndskud, totalAfkast, totalVaekst
    };
  }

  function computePortefoljeAarStats(rows, aar){
    const aarRows = rows.filter(r => r.aar === aar);
    const filled = aarRows.filter(r => r.endringKr != null);
    const medIndskud = aarRows.filter(r => r.indskud != null);
    const bedste = filled.length ? filled.reduce((a, b) => b.endringKr > a.endringKr ? b : a) : null;
    const vaerste = filled.length ? filled.reduce((a, b) => b.endringKr < a.endringKr ? b : a) : null;
    const totalKr = filled.reduce((s, r) => s + r.endringKr, 0);
    const faktor = filled.reduce((f, r) => f * (1 + (r.endringPct || 0) / 100), 1);
    const totalIndskud = medIndskud.reduce((s, r) => s + r.indskud, 0);
    const groenne = filled.filter(r => r.endringKr >= 0).length;
    const roede = filled.filter(r => r.endringKr < 0).length;
    const foerste = aarRows.find(r => r.vaerdi != null) || null;
    const sidste = [...aarRows].reverse().find(r => r.vaerdi != null) || null;
    return { aar, bedste, vaerste, totalKr, pct: (faktor - 1) * 100, totalIndskud, groenne, roede, foerste, sidste, antal: aarRows.length };
  }

  function buildPortefoljeChartSvg(rows){
    const filled = rows.filter(r => r.vaerdi != null);
    if(filled.length < 2) return '';
    const W = 640, H = 220, padL = 54, padR = 14, padT = 14, padB = 24;
    const maxVal = Math.max(...filled.map(r => r.vaerdi), 1);
    const minVal = Math.min(0, ...filled.map(r => r.vaerdi));
    const x = (i) => padL + (i / (filled.length - 1)) * (W - padL - padR);
    const y = (val) => padT + (1 - (val - minVal) / (maxVal - minVal || 1)) * (H - padT - padB);
    const linjePath = filled.map((r, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(r.vaerdi).toFixed(1)}`).join(' ');
    const fladePath = linjePath + ` L ${x(filled.length - 1).toFixed(1)} ${y(minVal).toFixed(1)} L ${x(0).toFixed(1)} ${y(minVal).toFixed(1)} Z`;
    const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
      const val = minVal + (maxVal - minVal) * f;
      const yy = y(val).toFixed(1);
      return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1" />
              <text x="${padL - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle" font-size="10" font-family="Inconsolata, monospace" fill="var(--text-faint)">${fmtKrShort(val)}</text>`;
    }).join('');
    const labelStep = Math.max(1, Math.ceil(filled.length / 6));
    const xLabels = filled.filter((r, i) => i === 0 || i === filled.length - 1 || i % labelStep === 0)

  function beregnUdtryk(raw){
    const s = String(raw == null ? '' : raw).trim();
    if(!s) return null;
    if(!/^[-+\d.,\s]+$/.test(s)) return null;
    const dele = s.split(/(?=[+-])/).map(d => d.trim()).filter(Boolean);
    let sum = 0, harTal = false;
    for(const del of dele){
      let tal = del.replace(/\s/g, '');
      const sidsteKomma = tal.lastIndexOf(',');
      const sidstePunktum = tal.lastIndexOf('.');
      if(sidsteKomma !== -1 && sidstePunktum !== -1){
        // Sidste separator er decimaltegn: både 1.234,56 og 1,234.56 accepteres.
        if(sidsteKomma > sidstePunktum) tal = tal.replace(/\./g, '').replace(',', '.');
        else tal = tal.replace(/,/g, '');
      } else if(sidsteKomma !== -1){
        tal = tal.replace(',', '.');
      }
      const num = Number(tal);
      if(!Number.isFinite(num)) return null;
      sum += num; harTal = true;
    }
    return harTal ? sum : null;
  }

  let pendingPfReminder = null;
  let pfReminderDatoNoegle = '';

  function erSidsteDagIMaaned(dato){
    const aar = dato.getFullYear();
    const maaned = dato.getMonth();
    return dato.getDate() === new Date(aar, maaned + 1, 0).getDate();
  }

  function aktuelPfPaamindelse(){
    if(!state) return null;
    const nu = new Date();
    if(!erSidsteDagIMaaned(nu)) return null;
    const aar = nu.getFullYear(), maaned = nu.getMonth() + 1;
    const findes = (state.portefolje || []).some(e => e.aar === aar && e.maaned === maaned && Number.isFinite(e.vaerdi));
    return findes ? null : { aar, maaned };
  }

  function tjekPfPaamindelse(){
    if(!state) return;
    const nu = new Date();
    pfReminderDatoNoegle = `${nu.getFullYear()}-${nu.getMonth()+1}-${nu.getDate()}`;
    pendingPfReminder = aktuelPfPaamindelse();
  }

  // Holder påmindelsen korrekt, hvis appen står åben hen over midnat.
  setInterval(() => {
    if(!state || (!currentUser && !demoMode)) return;
    const nu = new Date();
    const noegle = `${nu.getFullYear()}-${nu.getMonth()+1}-${nu.getDate()}`;
    if(noegle !== pfReminderDatoNoegle){

  function upsertPortefoljeEntry(aar, maaned, vaerdiRaw, indskudRaw, noteRaw){
    if(!state.portefolje) state.portefolje = [];
    const vaerdi = beregnUdtryk(vaerdiRaw), indskud = beregnUdtryk(indskudRaw);
    const note = String(noteRaw == null ? '' : noteRaw).trim();
    let entry = state.portefolje.find(e => e.aar === aar && e.maaned === maaned);
    if(vaerdi == null && indskud == null && !note){
      if(entry) state.portefolje = state.portefolje.filter(e => e !== entry);
      return;
    }
    if(!entry){
      entry = { aar, maaned };
      state.portefolje.push(entry);
    }
    if(entry.indskud !== indskud){ delete entry.cashIn; delete entry.cashOut; }
    entry.vaerdi = vaerdi; entry.indskud = indskud; entry.note = note || null;
    entry.vaerdiRaw = String(vaerdiRaw == null ? '' : vaerdiRaw).trim() || null;
    entry.indskudRaw = String(indskudRaw == null ? '' : indskudRaw).trim() || null;
  }

  function slettPortefoljeEntry(aar, maaned){
    const idx = (state.portefolje || []).findIndex(e => e.aar === aar && e.maaned === maaned);
    if(idx === -1) return;
    const [removed] = state.portefolje.splice(idx, 1);
    save();
    tjekPfPaamindelse();
    refreshPfReminderToast();
    if(pendingPfDeleteTimer) clearTimeout(pendingPfDeleteTimer);
    pendingPfDelete = removed;
    refreshPfToast();
    pendingPfDeleteTimer = setTimeout(() => { pendingPfDelete = null; refreshPfToast(); }, 6000);
  }

  window.fortrydPf = function(){
    if(!pendingPfDelete) return;
    if(!state.portefolje) state.portefolje = [];
    state.portefolje.push(pendingPfDelete);

    if(pendingPfDeleteTimer) clearTimeout(pendingPfDeleteTimer);

  function naesteMaanedEfterSeneste(){

  function monthCashFlows(entry){
    const net = entry?.indskud || 0;
    if(Number.isFinite(entry?.cashIn) && Number.isFinite(entry?.cashOut) &&
       Math.abs(entry.cashIn - entry.cashOut - net) < 0.005){
      return {incoming:entry.cashIn, outgoing:entry.cashOut, legacy:false};
    }
    return {incoming:Math.max(0,net), outgoing:Math.max(0,-net), legacy:!!net};
  }

    document.getElementById('pfModalHeader').innerHTML = '<div class="ak-modal-header"><div class="ak-modal-title">Indskud og udtræk</div><button class="ak-modal-close" id="quickClose" aria-label="Luk">×</button></div>';
    document.getElementById('pfModalBody').innerHTML = '<form id="quickMonthForm" style="padding:22px"><p style="margin:0 0 18px;font-size:13px;color:var(--text-muted);line-height:1.6">Se og ret månedens samlede indskud og udtræk.</p><div class="ak-field"><label for="quickMonth">Måned</label><input id="quickMonth" type="month" required value="'+month+'"></div><div class="ak-field-row"><div class="ak-field"><label for="quickIncoming">Indskud (kr.)</label><input id="quickIncoming" type="text" inputmode="decimal" placeholder="0,00"></div><div class="ak-field"><label for="quickOutgoing">Udtræk (kr.)</label><input id="quickOutgoing" type="text" inputmode="decimal" placeholder="0,00"></div></div><p style="font-size:11px;color:var(--text-muted);line-height:1.6">Begge beløb skrives positivt. Tilføj fx + 500 til et eksisterende beløb, eller ret totalen direkte. Tomt felt tæller som 0.</p><div class="ak-carry-note" id="quickTotal" aria-live="polite"></div><div id="quickLegacy" style="font-size:11px;color:var(--text-muted);margin-bottom:12px"></div><div id="quickError" role="alert" style="color:var(--red);font-size:12px"></div><div class="ak-modal-footer" style="padding:16px 0 0"><button type="button" class="ak-cancel-btn" id="quickCancel">Annuller</button><button type="submit" class="ak-submit-btn">Gem ændringer</button></div></form>';
    const monthInput=document.getElementById('quickMonth');
    const incoming=document.getElementById('quickIncoming');
    const outgoing=document.getElementById('quickOutgoing');
    const existing=()=>(state.portefolje || []).find(e=>e.aar===Number(monthInput.value.slice(0,4)) && e.maaned===Number(monthInput.value.slice(5,7)));
    const read=input=>input.value.trim() ? beregnUdtryk(input.value) : 0;
    const valid=n=>Number.isFinite(n) && n>=0;
    const update=()=>{
      const a=read(incoming), b=read(outgoing);
      document.getElementById('quickTotal').textContent=valid(a)&&valid(b) ? 'Månedens nettoindskud: '+fmtKr(Math.round((a-b)*100)/100)+' · indskud minus udtræk' : 'Skriv gyldige beløb på 0 kr. eller mere.';
      document.getElementById('quickError').textContent='';
    };
    const load=()=>{
      const flows=monthCashFlows(existing());
      incoming.value=String(flows.incoming).replace('.',',');
      outgoing.value=String(flows.outgoing).replace('.',',');
      document.getElementById('quickLegacy').textContent=flows.legacy ? 'Tidligere er kun nettobeløbet gemt. Det vises som ét beløb her; du kan rette fordelingen.' : '';
      update();
    };
    monthInput.addEventListener('change',load);
    incoming.addEventListener('input',update);
    outgoing.addEventListener('input',update);
    document.getElementById('quickClose').onclick=closePfModal;
    document.getElementById('quickCancel').onclick=closePfModal;

      const a=read(incoming), b=read(outgoing);

      }
      const [aar,maaned]=monthInput.value.split('-').map(Number);
      state.portefolje=state.portefolje || [];
      let entry=existing();
      if(!entry){entry={aar,maaned,vaerdi:null,note:null};state.portefolje.push(entry);}
      entry.cashIn=Math.round(a*100)/100;
      entry.cashOut=Math.round(b*100)/100;
      entry.indskud=Math.round((entry.cashIn-entry.cashOut)*100)/100;
      entry.indskudRaw=String(entry.indskud).replace('.',',');
      save();closePfModal();render();
    };
    load();incoming.focus();

    if(eksisterende){

  function getAlleSalgBeregnet(){
    const { perYear, askPerYear } = computeAll();
    let alle = [];
    Object.keys(perYear).forEach(y => { alle = alle.concat(perYear[y].sales); });
    Object.keys(askPerYear).forEach(y => { alle = alle.concat(askPerYear[y].sales); });
    return alle;
  }

  function getAlleHandler(){
    const certs = (state.certificates || []).map(c => ({
      id: c.id, isCertificate: true, navn: c.name || 'Unavngivet certifikat', type: 'Certifikat',
      kind: c.kind || 'Certifikat', salgDato: c.date || '', aar: parseInt(String(c.date || '').slice(0,4), 10) || new Date().getFullYear(),
      gevinst: certificateResult(c), skat: Math.max(0, certificateResult(c)) * (Number(state.certificateTaxRate) || 0) / 100,
      maegler: 'Ikke angivet', note: c.note || '', startValue: c.startValue, endValue: c.endValue, costs: c.costs, date: c.date
    }));
    return getAlleSalgBeregnet().concat(certs);
  }

  function certifikatSearchEntryHtml(c){
    const raw = { id:c.id, name:c.navn, kind:c.kind, date:c.date || c.salgDato, startValue:c.startValue, endValue:c.endValue, costs:c.costs };
    return certifikatEntryHtml(raw).replaceAll('data-cert-edit=', 'data-sog-cert-edit=').replaceAll('data-cert-delete=', 'data-sog-cert-del=');
  }

  function filtrerOgSorterSalg(alle){
    let filtered = alle.filter(s => {
      const q = sogQuery.trim().toLowerCase();
      const matchQuery = q === '' || (s.navn || '').toLowerCase().includes(q) || (s.ticker || '').toLowerCase().includes(q);
      const matchYear = sogYear === 'alle' || s.aar === parseInt(sogYear);
      const matchType = sogType === 'alle' || s.type === sogType;
      const matchDepot = sogDepot === 'alle' || (sogDepot === 'certifikater' ? !!s.isCertificate : sogDepot === 'ask' ? s.satsmode === 'ask' : !s.isCertificate && s.satsmode !== 'ask');
      const matchMaegler = sogMaegler === 'alle' || (s.maegler || 'Ikke angivet') === sogMaegler;
      return matchQuery && matchYear && matchType && matchDepot && matchMaegler;
    });
    filtered.sort((a, b) => {
      if(sogSort === 'nyeste') return b.aar - a.aar || (b.salgDato || '').localeCompare(a.salgDato || '');
      if(sogSort === 'aeldste') return a.aar - b.aar || (a.salgDato || '').localeCompare(b.salgDato || '');
      if(sogSort === 'stoerst-gevinst') return b.gevinst - a.gevinst;
      if(sogSort === 'stoerst-tab') return a.gevinst - b.gevinst;
      if(sogSort === 'depot-almindeligt') return Number(a.satsmode === 'ask') - Number(b.satsmode === 'ask') || b.aar - a.aar || (b.salgDato || '').localeCompare(a.salgDato || '');
      if(sogSort === 'depot-ask') return Number(b.satsmode === 'ask') - Number(a.satsmode === 'ask') || b.aar - a.aar || (b.salgDato || '').localeCompare(a.salgDato || '');
      if(sogSort === 'maegler-az') return (a.maegler || 'Ikke angivet').localeCompare(b.maegler || 'Ikke angivet', 'da');
      if(sogSort === 'maegler-za') return (b.maegler || 'Ikke angivet').localeCompare(a.maegler || 'Ikke angivet', 'da');
      return 0;
    });
    return filtered;
  }

    const [removed] = state.sales.splice(idx, 1);

    if(pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
    pendingDelete = removed;
    renderBloedt();
    pendingDeleteTimer = setTimeout(() => { pendingDelete = null; renderBloedt(); }, 6000);

  function lotBelobDkk(lot, valuta){
    if((lot.mode || 'kurs') === 'dkk') return parseFloat(lot.totalDkk) || 0;
    const antal = parseFloat(lot.antal) || 0;
    const kurs = parseFloat(lot.kurs) || 0;
    const rate = valuta === 'DKK' ? 1 : (parseFloat(lot.rate) || 0);
    return antal * kurs * rate + (parseFloat(lot.komk) || 0);
  }

  function beregnHoldetid(s){
    const koebsdatoer = (s.buys || []).map(l => l.dato).filter(Boolean).sort();
    if(!koebsdatoer.length || !s.salgDato) return 'Ikke beregnet';
    const tilUtc = value => {
      const [y, m, d] = String(value).split('-').map(Number);
      return Date.UTC(y, m - 1, d);
    };
    const dage = Math.max(0, Math.round((tilUtc(s.salgDato) - tilUtc(koebsdatoer[0])) / 86400000));
    if(dage < 60) return `${dage} dage`;
    if(dage < 730) return `${Math.round(dage / 30.44)} måneder`;
    const aar = dage / 365.25;
    return `${aar.toLocaleString('da-DK', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} år`;
  }

  function findComputedSale(saleId){
    return getAlleSalgBeregnet().find(s => s.id === saleId) || null;
  }

  function renderSaleDetailsContent(s){
    const isGain = s.gevinst >= 0;
    const pct = s.kobsbelob !== 0 ? (s.gevinst / s.kobsbelob) * 100 : 0;
    const pctStr = (pct >= 0 ? '+' : '') + pct.toLocaleString('da-DK', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
    const satsMode = s.satsmode || 'auto';
    const isAsk = satsMode === 'ask';
    const satsLabel = satsMode === 'auto' ? 'Automatisk 27/42%' : isAsk ? 'Aktiesparekonto · 17%' : `${satsMode}% fast sats`;
    const lots = s.buys || [];
    const sorteretLots = lots.slice().sort((a, b) => String(a.dato || '').localeCompare(String(b.dato || '')));
    const foersteKoeb = sorteretLots.length ? formatDatoDa(sorteretLots[0].dato) : 'Ikke angivet';
    const lotsHtml = lots.length ? lots.map((lot, index) => {
      const antal = (parseFloat(lot.antal) || 0).toLocaleString('da-DK', { maximumFractionDigits: 6 });
      const kursTekst = (lot.mode || 'kurs') === 'dkk'
        ? 'Samlet beløb indtastet i DKK'
        : `${fmtValuta(parseFloat(lot.kurs) || 0, s.valuta)} pr. stk.`;
      return `
        <div class="ak-details-lot">
          <span class="ak-details-lot-date">${formatDatoDa(lot.dato)}</span>
          <span class="ak-details-lot-main">Køb ${index + 1} · ${antal} stk.<br><span style="font-weight:500;color:var(--text-faint);">${escapeHtml(kursTekst)}</span></span>
          <span class="ak-details-lot-amount">${fmtKr(lotBelobDkk(lot, s.valuta))}</span>
        </div>`;
    }).join('') : `<div class="ak-broker-empty">Ingen køb er registreret.</div>`;

    const gakValuta = computeGakValuta(s.buys || [], s.valuta);
    const netto = s.gevinst - s.skat;
    const resultatOrd = isGain ? 'gevinst' : 'tab';
    const skattelabel = isAsk ? 'Vejledende ASK-skat' : 'Beregnet skat';
    const nativeGak = gakValuta ? fmtValuta(gakValuta.gak, s.valuta) + (gakValuta.komplet ? '' : ' · delvis') : (s.valuta === 'DKK' ? fmtKr(s.gak) : 'Ikke beregnet');

    const antalSolgt = parseFloat(s.antalSolgt) || 0;
    const salgRate = s.valuta === 'DKK' ? 1 : (parseFloat(s.salgRate) || 0);
    let salgskursValuta = 0;
    let salgskursDkk = 0;
    if((s.salgMode || 'kurs') === 'dkk'){
      const bruttoDkk = parseFloat(s.salgBelobDkk) || 0;
      salgskursDkk = antalSolgt > 0 ? bruttoDkk / antalSolgt : 0;
      salgskursValuta = s.valuta === 'DKK' ? salgskursDkk : (salgRate > 0 ? salgskursDkk / salgRate : 0);
    } else {
      salgskursValuta = parseFloat(s.salgskurs) || 0;
      salgskursDkk = salgskursValuta * salgRate;
    }
    const salgskursValutaTekst = salgskursValuta > 0 ? fmtValuta(salgskursValuta, s.valuta) : 'Ikke registreret';
    const salgskursDkkTekst = salgskursDkk > 0 ? fmtKr(salgskursDkk) : 'Ikke beregnet';
    const antalTekst = antalSolgt.toLocaleString('da-DK', { maximumFractionDigits: 6 }) + ' stk.';
    const koebKursRows = s.valuta === 'DKK'
      ? [['Gennemsnitskurs i DKK', fmtKr(s.gak)]]
      : [[`Gennemsnitskurs i ${s.valuta}`, nativeGak], ['Gennemsnitskurs i DKK', fmtKr(s.gak)]];
    const salgKursRows = s.valuta === 'DKK'
      ? [['Salgskurs i DKK', salgskursDkkTekst]]
      : [[`Salgskurs i ${s.valuta}`, salgskursValutaTekst], ['Salgskurs i DKK', salgskursDkkTekst]];

    const infoRows = rows => rows.map(([label, value]) => `
      <div class="ak-details-info-row">
        <span class="ak-details-info-label">${escapeHtml(label)}</span>
        <span class="ak-details-info-value">${escapeHtml(String(value))}</span>
      </div>`).join('');

    const tradeRows = rows => rows.map(([label, value]) => `
      <div class="ak-details-trade-row">
        <span class="ak-details-trade-label">${escapeHtml(label)}</span>
        <span class="ak-details-trade-value">${escapeHtml(String(value))}</span>
      </div>`).join('');

    return `
      <div class="ak-modal-header">
        <div class="ak-modal-title" id="saleDetailsTitle">Overblik over salget</div>
        <button class="ak-modal-close" id="saleDetailsClose" aria-label="Luk">×</button>
      </div>
      <div class="ak-sale-details-body">
        <div class="ak-details-hero">
          ${saleIdentityHtml(s, isGain, true)}
          <div class="ak-details-return">
            <div class="ak-details-return-value ${isGain ? 'pos' : 'neg'}">${pctStr}</div>
            <div class="ak-details-return-label">Afkast</div>
          </div>
        </div>

        ${s.ticker ? `<div class="ak-details-top-actions"><a class="ak-details-price-link" href="${escapeHtml(googleKursUrl(s))}" target="_blank" rel="noopener">${iconExternal()} Tjek den aktuelle kurs på Google</a></div>` : ''}

        <div class="ak-details-story">
          <span aria-hidden="true">💡</span>
          <span>Handlen gav et <strong>${resultatOrd} på ${fmtKr(Math.abs(s.gevinst))}</strong> svarende til <strong>${pctStr}</strong>. Efter den viste skatteberegning er resultatet <strong>${fmtKr(netto)}</strong>.</span>
        </div>

        <div class="ak-details-trade-grid">
          <section class="ak-details-trade-card purchase">
            <div class="ak-details-trade-head">
              <div class="ak-details-trade-title"><span class="ak-details-trade-icon">K</span>Køb</div>
              <span class="ak-details-trade-date">${foersteKoeb}</span>
            </div>
            <div class="ak-details-trade-primary">
              <div class="ak-details-trade-primary-label">Kostpris for de solgte aktier</div>
              <div class="ak-details-trade-primary-value">${fmtKr(s.kobsbelob)}</div>
            </div>
            <div class="ak-details-trade-rows">
              ${tradeRows([
                ['Antal', antalTekst],
                ...koebKursRows
              ])}
            </div>
          </section>

          <section class="ak-details-trade-card sale">
            <div class="ak-details-trade-head">
              <div class="ak-details-trade-title"><span class="ak-details-trade-icon">S</span>Salg</div>
              <span class="ak-details-trade-date">${formatDatoDa(s.salgDato)}</span>
            </div>
            <div class="ak-details-trade-primary">
              <div class="ak-details-trade-primary-label">Salgsbeløb efter omkostninger</div>
              <div class="ak-details-trade-primary-value">${fmtKr(s.salgsbelob)}</div>
            </div>
            <div class="ak-details-trade-rows">
              ${tradeRows([
                ['Antal', antalTekst],
                ...salgKursRows
              ])}
            </div>
          </section>
        </div>

        <div class="ak-details-summary">
          <div class="ak-details-stat"><div class="ak-details-stat-label">Gevinst / tab</div><div class="ak-details-stat-value ${isGain ? 'pos' : 'neg'}">${fmtKr(s.gevinst)}</div></div>
          <div class="ak-details-stat"><div class="ak-details-stat-label">${skattelabel}</div><div class="ak-details-stat-value">${fmtKr(s.skat)}</div>${isAsk ? '<div class="ak-details-tax-note">Bankens lageropgørelse er den endelige.</div>' : ''}</div>
          <div class="ak-details-stat"><div class="ak-details-stat-label">Efter skat</div><div class="ak-details-stat-value ${netto >= 0 ? 'pos' : 'neg'}">${fmtKr(netto)}</div></div>
        </div>

        <div class="ak-details-groups">
          <section class="ak-details-group">
            <div class="ak-details-group-title">Konto og registrering</div>
            ${infoRows([
              ['Konto', isAsk ? 'Aktiesparekonto' : 'Almindeligt depot'],
              ['Beskatning', satsLabel],
              ['Mægler', s.maegler || 'Ikke angivet'],
              ['Valuta', s.valuta || 'DKK'],
              ['Købt i alt', `${(parseFloat(s.totalKobtAntal) || 0).toLocaleString('da-DK', { maximumFractionDigits: 6 })} stk.`],
              ['Holdetid', beregnHoldetid(s)]
            ])}
          </section>
        </div>

        <div class="ak-details-section-title">Registrerede køb</div>
        <div class="ak-details-lots">${lotsHtml}</div>
      </div>
      <div class="ak-sale-details-footer">
        <button class="ak-cancel-btn" id="saleDetailsCloseFooter">Luk</button>
        <button class="ak-submit-btn" id="saleDetailsEdit" style="flex:0 0 auto;">Rediger salg</button>
      </div>`;
  }

  function openSaleDetails(saleId){
    const sale = findComputedSale(saleId);
    const overlay = document.getElementById('saleDetailsOverlay');
    const content = document.getElementById('saleDetailsContent');
    if(!sale || !overlay || !content) return;
    detailsSaleId = saleId;
    content.innerHTML = renderSaleDetailsContent(sale);
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    lockBackgroundScroll();
    wireBackdropClose(overlay, closeSaleDetails);
    document.getElementById('saleDetailsClose').addEventListener('click', closeSaleDetails);
    document.getElementById('saleDetailsCloseFooter').addEventListener('click', closeSaleDetails);
    document.getElementById('saleDetailsEdit').addEventListener('click', () => {
      const id = detailsSaleId;
      // Skjul faktavinduet, men behold baggrundslåsen, mens redigeringsvinduet åbnes.
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      detailsSaleId = null;
      openModal(id);
    });
    document.getElementById('saleDetailsClose').focus();
  }

  function closeSaleDetails(){
    const overlay = document.getElementById('saleDetailsOverlay');
    if(overlay){
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
    }
    unlockBackgroundScroll();
    detailsSaleId = null;
    certificateDetailsId = null;
  }

  function wireSaleCards(root){
    if(!root) return;
    root.querySelectorAll('[data-sale-details]').forEach(card => {
      card.addEventListener('click', (e) => {
        if(e.target.closest('button, a, input, select')) return;
        openSaleDetails(card.dataset.saleDetails);
      });
      card.addEventListener('keydown', (e) => {
        if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button, a, input, select')){
          e.preventDefault();
          openSaleDetails(card.dataset.saleDetails);
        }
      });
    });
  }

  function valutaOptionsHtml(){
    const standard = [
      ['DKK', 'DKK'],
      ['USD', 'USD – amerikanske dollar'],
      ['EUR', 'EUR – euro'],
      ['GBP', 'GBP – britiske pund'],
      ['SEK', 'SEK – svenske kroner'],
      ['NOK', 'NOK – norske kroner'],
      ['CHF', 'CHF – schweizerfranc'],
      ['JPY', 'JPY – japanske yen']
    ];
    const custom = (state.customCurrencies || []).map(c => [c, c]);
    const all = standard.concat(custom);
    return all.map(([val, label]) => `<option value="${val}">${label}</option>`).join('')
      + `<option value="__tilfoej__">+ Tilføj anden valuta …</option>`;
  }

  function haandterValutaValg(){
    const sel = document.getElementById('valuta');
    if(sel.value === '__tilfoej__'){
      const kode = prompt('Skriv valutakoden (3 bogstaver, fx PLN, AUD, CAD):');
      const clean = (kode || '').trim().toUpperCase();
      if(clean && /^[A-Z]{3}$/.test(clean)){
        if(!state.customCurrencies) state.customCurrencies = [];
        if(!state.customCurrencies.includes(clean) && !['DKK','USD','EUR','GBP','SEK','NOK','CHF','JPY'].includes(clean)){
          state.customCurrencies.push(clean);
          save();
        }
        sel.innerHTML = valutaOptionsHtml();
        sel.value = clean;
      } else {
        sel.value = 'DKK';
        if(kode !== null) alert('Ugyldig valutakode — brug 3 bogstaver, fx USD.');
      }
    }
    updateFxVisibility();
  }

  function updateFxVisibility(){
    const show = currentValuta() !== 'DKK';
    const salgFx = document.querySelector('.salgFxField');
    if(salgFx) salgFx.style.display = show ? '' : 'none';
    renderLots();
  }

  function renderLots(){
    const area = document.getElementById('lotsArea');
    if(!area) return;
    const v = currentValuta();
    const showFx = v !== 'DKK';
    area.innerHTML = draftLots.map((lot, i) => `
      <div class="ak-lot" data-i="${i}">
        ${draftLots.length > 1 ? `<button type="button" class="ak-lot-remove" data-i="${i}">×</button>` : ''}
        <div class="ak-field-row">
          <div class="ak-field"><label>Købsdato <span class="ak-hint-inline">(brug "Udført"-datoen)</span></label><input type="date" class="lot-dato" data-i="${i}" value="${lot.dato}"></div>
          <div class="ak-field"><label>Antal</label><input type="number" class="lot-antal" data-i="${i}" value="${lot.antal}" min="0" step="any" placeholder="fx 1,2247"></div>
        </div>
        <div class="ak-mode-toggle">
          <button type="button" class="ak-mode-btn lot-mode-btn ${lot.mode === 'dkk' ? 'active' : ''}" data-i="${i}" data-mode="dkk">Beløb i DKK</button>
          <button type="button" class="ak-mode-btn lot-mode-btn ${lot.mode !== 'dkk' ? 'active' : ''}" data-i="${i}" data-mode="kurs">Kurs + valutakurs</button>
        </div>
        ${lot.mode === 'dkk' ? `
          <div class="ak-field"><label>Beløb i DKK</label><input type="number" class="lot-totaldkk" data-i="${i}" value="${lot.totalDkk}" min="0" step="any" placeholder="fx 2.292,79"></div>
        ` : `
          <div class="ak-field-row">
            <div class="ak-field"><label>Kurs/stk. (${v})</label><input type="number" class="lot-kurs" data-i="${i}" value="${lot.kurs}" min="0" step="any" placeholder="150,00"></div>
            <div class="ak-field lot-fx-field" style="display:${showFx ? '' : 'none'};"><label>Valutakurs → DKK</label><input type="number" class="lot-rate" data-i="${i}" value="${lot.rate}" min="0" step="any" placeholder="auto"></div>
          </div>
          <div class="ak-fx-hint lot-fx-hint" data-i="${i}"></div>
          <div class="ak-field"><label>Købsomkostninger (DKK) <span class="ak-hint-inline">(kurtage/gebyr · lægges til kostprisen)</span></label><input type="number" class="lot-komk" data-i="${i}" value="${lot.komk || '0'}" min="0" step="any" placeholder="fx kurtage"></div>
        `}
      </div>
    `).join('');

    area.querySelectorAll('.lot-dato, .lot-antal, .lot-kurs, .lot-rate, .lot-totaldkk, .lot-komk').forEach(inp => inp.addEventListener('input', onLotFieldChange));
    area.querySelectorAll('.lot-dato, .lot-kurs').forEach(inp => inp.addEventListener('change', () => maybeAutoFetchLot(parseInt(inp.dataset.i))));
    area.querySelectorAll('.ak-lot-remove').forEach(btn => btn.addEventListener('click', () => { draftLots.splice(parseInt(btn.dataset.i), 1); renderLots(); updatePreview(); }));
    area.querySelectorAll('.lot-mode-btn').forEach(btn => btn.addEventListener('click', () => {
      draftLots[parseInt(btn.dataset.i)].mode = btn.dataset.mode;
      renderLots();
    }));
    updatePreview();
  }

  function syncDraftSalgAmountFromDom(){
    const dkkEl = document.getElementById('salgBelobDkk');
    const kursEl = document.getElementById('salgskurs');
    const rateEl = document.getElementById('salgRate');
    if(dkkEl) draftSalgBelobDkk = dkkEl.value;
    if(kursEl) draftSalgskurs = kursEl.value;
    if(rateEl) draftSalgRate = rateEl.value;
  }

  function renderSalgAmountArea(){
    const area = document.getElementById('salgAmountArea');
    if(!area) return;
    const v = currentValuta();
    const showFx = v !== 'DKK';
    document.getElementById('salgModeDkkBtn').classList.toggle('active', draftSalgMode === 'dkk');
    document.getElementById('salgModeKursBtn').classList.toggle('active', draftSalgMode !== 'dkk');

    if(draftSalgMode === 'dkk'){
      area.innerHTML = `<div class="ak-field"><label>Beløb i DKK</label><input type="number" id="salgBelobDkk" value="${escapeHtml(String(draftSalgBelobDkk || ''))}" placeholder="fx 2.807,00" min="0" step="any"></div>`;
      document.getElementById('salgBelobDkk').addEventListener('input', (e) => { draftSalgBelobDkk = e.target.value; updatePreview(); });
    } else {
      area.innerHTML = `
        <div class="ak-field-row">
          <div class="ak-field"><label for="salgskurs">Salgskurs/stk. (${v})</label><input type="number" id="salgskurs" value="${escapeHtml(String(draftSalgskurs || ''))}" placeholder="178,50" min="0" step="any"></div>
          <div class="ak-field salgFxField" style="display:${showFx ? '' : 'none'};"><label for="salgRate">Valutakurs → DKK</label><input type="number" id="salgRate" value="${escapeHtml(String(draftSalgRate || ''))}" placeholder="auto" min="0" step="any"></div>
        </div>
        <div class="ak-fx-hint" id="salgFxHint"></div>
      `;
      document.getElementById('salgskurs').addEventListener('input', (e) => { draftSalgskurs = e.target.value; updatePreview(); });
      document.getElementById('salgRate').addEventListener('input', (e) => {
        draftSalgRate = e.target.value;
        const hintEl = document.getElementById('salgFxHint');
        const manuel = parseFloat(e.target.value) || 0;
        if(hintEl){
          hintEl.textContent = manuel > 0 ? `Manuel valutakurs bruges: 1 ${currentValuta()} = ${manuel.toLocaleString('da-DK', { maximumFractionDigits: 6 })} DKK` : '';
          hintEl.className = 'ak-fx-hint manual';
        }
        updatePreview();
      });
    }
    updatePreview();
  }



  function onLotFieldChange(e){
    const i = parseInt(e.target.dataset.i);
    const cls = e.target.classList;
    if(cls.contains('lot-dato')) draftLots[i].dato = e.target.value;
    if(cls.contains('lot-antal')) draftLots[i].antal = e.target.value;
    if(cls.contains('lot-kurs')) draftLots[i].kurs = e.target.value;
    if(cls.contains('lot-rate')){
      draftLots[i].rate = e.target.value;
      const hintEl = document.querySelector(`.lot-fx-hint[data-i="${i}"]`);
      const manuel = parseFloat(e.target.value) || 0;
      if(hintEl){
        hintEl.textContent = manuel > 0 ? `Manuel valutakurs bruges: 1 ${currentValuta()} = ${manuel.toLocaleString('da-DK', { maximumFractionDigits: 6 })} DKK` : '';
        hintEl.className = 'ak-fx-hint lot-fx-hint manual';
      }
    }
    if(cls.contains('lot-totaldkk')) draftLots[i].totalDkk = e.target.value;
    if(cls.contains('lot-komk')) draftLots[i].komk = e.target.value;
    updatePreview();
  }

  async function maybeAutoFetchLot(i){
    const v = currentValuta();
    if(v === 'DKK') return;
    const lot = draftLots[i];
    if(!lot.dato) return;
    const hintEl = document.querySelector(`.lot-fx-hint[data-i="${i}"]`);
    if(hintEl) hintEl.textContent = 'Henter valutakurs …';
    const result = await fetchRate(lot.dato, v);
    const rateInput = document.querySelector(`.lot-rate[data-i="${i}"]`);
    if(result){
      draftLots[i].rate = result.rate.toFixed(4);
      if(rateInput) rateInput.value = draftLots[i].rate;
      if(hintEl){
        const datotekst = result.date && result.date !== lot.dato ? ` · seneste bankdag ${result.date}` : ` · ${result.date || lot.dato}`;
        hintEl.textContent = `Automatisk kurs: 1 ${v} = ${result.rate.toFixed(4)} DKK${datotekst}`;
        hintEl.className = 'ak-fx-hint lot-fx-hint ok';
      }
    } else if(hintEl){
      const manuel = parseFloat(draftLots[i].rate) || 0;
      hintEl.textContent = manuel > 0
        ? `Automatisk kurs kunne ikke hentes lige nu. Din manuelle kurs ${manuel.toLocaleString('da-DK', { maximumFractionDigits: 6 })} bruges.`
        : 'Automatisk kurs kunne ikke hentes lige nu. Skriv valutakursen manuelt.';
      hintEl.className = `ak-fx-hint lot-fx-hint ${manuel > 0 ? 'manual' : 'err'}`;
    }
    updatePreview();
  }

  function buildDraftSale(){
    syncDraftSalgAmountFromDom();
    const valuta = currentValuta();
    const salgEl = document.getElementById('salgskurs');
    const salgRateEl = document.getElementById('salgRate');
    const salgDkkEl = document.getElementById('salgBelobDkk');
    return {
      ticker: normaliserTicker(document.getElementById('ticker').value),
      navn: document.getElementById('navn').value.trim(),
      logoUrl: draftLogoUrl,
      maegler: document.getElementById('maegler').value === '__tilfoej__' ? 'Ikke angivet' : document.getElementById('maegler').value,
      type: document.getElementById('type').value,
      aar: parseInt(document.getElementById('aar').value) || new Date().getFullYear(),
      valuta,
      buys: draftLots.filter(l => (parseFloat(l.antal)||0) > 0 && ((l.mode === 'dkk' && (parseFloat(l.totalDkk)||0) > 0) || (l.mode !== 'dkk' && (parseFloat(l.kurs)||0) > 0)))
        .map(l => ({
          dato: l.dato, antal: parseFloat(l.antal)||0, mode: l.mode,
          kurs: parseFloat(l.kurs)||0, rate: valuta==='DKK' ? 1 : (parseFloat(l.rate)||0),
          totalDkk: parseFloat(l.totalDkk)||0, komk: parseFloat(l.komk)||0
        })),
      salgDato: document.getElementById('salgDato').value,
      antalSolgt: parseFloat(document.getElementById('antalSolgt').value) || 0,
      salgMode: draftSalgMode,
      salgskurs: salgEl ? parseFloat(salgEl.value) || 0 : 0,
      salgRate: valuta==='DKK' ? 1 : (salgRateEl ? parseFloat(salgRateEl.value) || 0 : 0),
      salgBelobDkk: salgDkkEl ? parseFloat(salgDkkEl.value) || 0 : 0,
      salgsomk: parseFloat(document.getElementById('salgsomk').value) || 0,
      satsmode: document.getElementById('satsmode').value
    };
  }

  function salgBeloebUdfyldt(draft){
    return draft.salgMode === 'dkk' ? draft.salgBelobDkk > 0 : draft.salgskurs > 0;
  }

  function updatePreview(){
    const draft = buildDraftSale();
    const { totalAntal, gak } = computeGak(draft.buys, draft.valuta);
    const previewEl = document.getElementById('modalPreview');
    if(!previewEl) return;
    const isAsk = draft.satsmode === 'ask';
    const taxChoiceNoteEl = document.getElementById('taxChoiceNote');
    if(taxChoiceNoteEl){
      taxChoiceNoteEl.classList.toggle('ask', isAsk);
      taxChoiceNoteEl.textContent = isAsk
        ? 'Separat 17% · vejledende ASK-beregning.'
        : draft.satsmode === '27'
          ? 'Fast 27% på denne handel.'
          : draft.satsmode === '42'
            ? 'Fast 42% på denne handel.'
            : 'Automatisk 27/42% efter årets grænse.';
    }

    if(totalAntal <= 0 || draft.antalSolgt <= 0 || !salgBeloebUdfyldt(draft)){
      previewEl.innerHTML = '<div class="ak-preview-empty">Udfyld køb og salg i venstre side — resultatet opdateres her live.</div>';
      return;
    }

    const g = saleGevinst(draft);
    const { perYear, askPerYear } = computeAll(editingId);
    const threshold = progressionsgraenseInfo(draft.aar).amount;
    const ctx = isAsk
      ? (askPerYear[draft.aar] || { endCum: 0 })
      : (perYear[draft.aar] || { endCum: (state.andenPerYear[draft.aar] || 0) });
    const cumStart = ctx.endCum;
    let skat = 0;
    const from = cumStart, to = cumStart + g.gevinst;
    if(isAsk){
      skat = skatVedFastSats(to, 0.17) - skatVedFastSats(from, 0.17);
    } else if(draft.satsmode === '27'){
      skat = skatVedFastSats(to, 0.27) - skatVedFastSats(from, 0.27);
    } else if(draft.satsmode === '42'){
      skat = skatVedFastSats(to, 0.42) - skatVedFastSats(from, 0.42);
    } else {
      skat = skatVedProgression(to, threshold) - skatVedProgression(from, threshold);
    }
    const netto = g.gevinst - skat;
    const isGain = g.gevinst >= 0;
    const pct = g.kobsbelob !== 0 ? (g.gevinst / g.kobsbelob) * 100 : 0;
    const satsLabelPreview = draft.satsmode === 'auto' ? 'auto' : isAsk ? 'ASK 17%' : draft.satsmode + '%';

    let warn = '';
    if(draft.antalSolgt > totalAntal){
      warn = `<div class="ak-warn-note" style="margin-top:12px;">Du sælger ${draft.antalSolgt} stk., men har kun registreret køb af ${totalAntal} stk.</div>`;
    }

    previewEl.innerHTML = `
      <div class="ak-preview-hero">
        <div class="ak-preview-label">${isGain ? 'Gevinst' : 'Tab'}</div>
        <div class="ak-preview-amount" style="color:${isGain ? 'var(--green)' : 'var(--red)'}">${fmtKr(Math.abs(g.gevinst))}</div>
        <div class="ak-preview-pct">${fmtPct(pct)}</div>
      </div>
      <div class="ak-preview-row"><span class="k">Gennemsnitskurs (GAK)</span><span class="v">${fmtKr(gak)}</span></div>
      <div class="ak-preview-row"><span class="k">Købsbeløb</span><span class="v">${fmtKr(g.kobsbelob)}</span></div>
      <div class="ak-preview-row"><span class="k">Salgsbeløb</span><span class="v">${fmtKr(g.salgsbelob)}</span></div>
      <div class="ak-preview-row"><span class="k">Skat (${satsLabelPreview})</span><span class="v">${fmtKr(skat)}</span></div>
      <div class="ak-preview-row total"><span class="k">Efter skat</span><span class="v">${fmtKr(netto)}</span></div>
      ${warn}
    `;

  }

  function wireModalInputs(){
    document.getElementById('handelType').addEventListener('change', (e) => {
      if(e.target.value === 'certifikat'){ closeModal(); aktiesalgTab = 'certifikater'; openCertifikatModal(null); return; }
      document.getElementById('satsmode').value = e.target.value === 'ask' ? 'ask' : 'auto';
      updatePreview();
    });
    document.getElementById('addLotBtn').addEventListener('click', () => { draftLots.push({ dato: '', antal: '', kurs: '', rate: '1', mode: 'dkk', totalDkk: '', komk: '0' }); renderLots(); });
    document.getElementById('valuta').addEventListener('change', haandterValutaValg);
    document.getElementById('maegler').addEventListener('change', haandterMaeglerValg);
    const tickerEl = document.getElementById('ticker');
    tickerEl.addEventListener('input', () => {
      tickerEl.value = normaliserTicker(tickerEl.value);
      draftLogoUrl = '';
      setTickerStatus(tickerEl.value ? 'Venter på opslag …' : '');
      if(tickerLookupTimer) clearTimeout(tickerLookupTimer);
      tickerLookupTimer = setTimeout(koerTickerOpslag, 650);
      updatePreview();
    });
    tickerEl.addEventListener('blur', () => {
      if(tickerLookupTimer) clearTimeout(tickerLookupTimer);
      koerTickerOpslag();
    });
    ['navn','type','aar','maegler','antalSolgt','salgsomk','satsmode'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
      document.getElementById(id).addEventListener('change', updatePreview);
    });
    document.getElementById('salgModeDkkBtn').addEventListener('click', () => { syncDraftSalgAmountFromDom(); draftSalgMode = 'dkk'; renderSalgAmountArea(); });
    document.getElementById('salgModeKursBtn').addEventListener('click', () => { syncDraftSalgAmountFromDom(); draftSalgMode = 'kurs'; renderSalgAmountArea(); });
    function syncAarFraSalgDato(){
      const datoVal = document.getElementById('salgDato').value;
      if(datoVal && datoVal.length === 10){
        const aarFraDato = parseInt(datoVal.slice(0, 4), 10);
        if(aarFraDato) document.getElementById('aar').value = aarFraDato;
      }
    }
    document.getElementById('salgDato').addEventListener('input', () => { syncAarFraSalgDato(); updatePreview(); });
    document.getElementById('salgDato').addEventListener('change', async () => {
      syncAarFraSalgDato();
      updatePreview();
      const v = currentValuta();
      if(v === 'DKK' || draftSalgMode !== 'kurs') return;
      const dato = document.getElementById('salgDato').value;
      if(!dato) return;
      const hintEl = document.getElementById('salgFxHint');
      if(!hintEl) return;
      hintEl.textContent = 'Henter valutakurs …'; hintEl.className = 'ak-fx-hint';
      const result = await fetchRate(dato, v);
      if(result){
        draftSalgRate = result.rate.toFixed(4);
        document.getElementById('salgRate').value = draftSalgRate;
        const datotekst = result.date && result.date !== dato ? ` · seneste bankdag ${result.date}` : ` · ${result.date || dato}`;
        hintEl.textContent = `Automatisk kurs: 1 ${v} = ${result.rate.toFixed(4)} DKK${datotekst}`;
        hintEl.className = 'ak-fx-hint ok';
      } else {
        const manuel = parseFloat(draftSalgRate) || 0;
        hintEl.textContent = manuel > 0
          ? `Automatisk kurs kunne ikke hentes lige nu. Din manuelle kurs ${manuel.toLocaleString('da-DK', { maximumFractionDigits: 6 })} bruges.`
          : 'Automatisk kurs kunne ikke hentes lige nu. Skriv valutakursen manuelt.';
        hintEl.className = `ak-fx-hint ${manuel > 0 ? 'manual' : 'err'}`;
      }
      updatePreview();
    });
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
    document.getElementById('modalSaveBtn').addEventListener('click', saveModal);
    renderLots();
    renderSalgAmountArea();
    updateFxVisibility();
  }

      const maeglerNavn = s.maegler || 'Ikke angivet';
